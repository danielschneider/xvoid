# Reusable check job: install dependencies and run the single check script
# (lint, typecheck, format:check, test, build). Called by deployci.yml and deploy.yml.
# With `pages: true` the built dist/ is uploaded as the Pages artifact for deploy.yml.

name: Check

on:
  workflow_call:
    inputs:
      pages:
        description: Upload dist/ as the GitHub Pages artifact
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/configure-pages@v5
        if: ${{ inputs.pages }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.pages }}
        with:
          path: dist
